name: kaam_chalu
description: B2B Done-For-You Automation Platform for Indian SMEs

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.8.3
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^14.6.2
  
  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Forms & Validation
  reactive_forms: ^17.0.1
  
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  
  # Utilities
  intl: ^0.20.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  
  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.4
  
  # HTTP
  dio: ^5.7.0
  
  # JSON
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  
  # Assets will be added as needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/templates/
